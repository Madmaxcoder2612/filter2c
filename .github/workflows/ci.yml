name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "python[test]"
      - name: Tests (includes compiling the generated C and comparing with SciPy)
        run: python -m pytest -q
      - name: Generate the example filter and verify it
        run: filter2c butter-lowpass --order 4 --cutoff 40 --fs 1000 --name lp40 -o /tmp/lp40.h --write-runtime --verify
      - name: Example header is up to date
        run: diff /tmp/lp40.h examples/Butterworth40Hz/lp40.h
      - name: Generate the 50 Hz notch example and verify it
        run: filter2c notch --freq 50 --q 30 --fs 1000 --name notch50 -o /tmp/notch50.h --verify
      - name: Notch example header is up to date
        run: diff /tmp/notch50.h examples/HumNotch50Hz/notch50.h
      - name: Generate the ECG band-pass (0.5 to 40 Hz at 250 Hz) and verify it
        run: filter2c butter-bandpass --order 2 --low 0.5 --high 40 --fs 250 --name ecg -o /tmp/ecg.h --verify

  # Builds the examples with the real Arduino toolchain (arduino-cli), for two boards.
  arduino-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 3.3.12
            sketches: |
              - examples/ESP32SelfTest
              - examples/HumNotch50Hz
              - examples/Butterworth40Hz
          - board: UNO R4 WiFi
            fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            sketches: |
              - examples/HumNotch50Hz
              - examples/Butterworth40Hz
    name: Arduino build (${{ matrix.board }})
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketches }}
          libraries: |
            - source-path: ./
          enable-deltas-report: false

  # Checks library.properties and the library layout against the Arduino rules.
  arduino-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
